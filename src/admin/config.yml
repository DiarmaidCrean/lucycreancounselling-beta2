backend:
  name: git-gateway
  branch: main

media_folder: src/assets/images
public_folder: /assets/images

collections:
  # ── Global site settings ──────────────────────────────────
  - name: settings
    label: Site Settings
    files:
      - name: sitedata
        label: Global Settings
        file: src/_data/sitedata.json
        fields:
          - { label: Site Name, name: name, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Address, name: address, widget: string }

  # ── Individual pages ──────────────────────────────────────
  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: src/pages/homepage.md
        fields:
          - { label: Hero Headline, name: title, widget: string }
          - { label: Hero Subtitle, name: subtitle, widget: string }
          - { label: Lucy's Photo, name: photo, widget: image }
          - { label: Welcome Body, name: body, widget: markdown }
          - { label: Support Section Heading, name: support_heading, widget: string }
          - { label: Support Section Text, name: support_text, widget: markdown }
          - { label: Support Quote Overlay, name: support_quote, widget: string }
          - { label: Conditions Section Heading, name: conditions_heading, widget: string }
          - { label: Contact Section Heading, name: contact_heading, widget: string }
          - { label: Contact Section Subheading, name: contact_subheading, widget: string }

      - name: about
        label: About
        file: src/pages/about.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - { label: Photo, name: photo, widget: image }
          - label: Body (top section)
            name: body_top
            widget: markdown
            hint: "Content shown above the testimonial — about Lucy and her approach."
          - label: Testimonial quote
            name: testimonial_text
            widget: text
            hint: "A short client quote shown in the highlighted block between sections."
          - label: Testimonial attribution
            name: testimonial_attribution
            widget: string
            hint: "Who said it — e.g. Anonymous, or a first name."
          - label: Body (bottom section)
            name: body_bottom
            widget: markdown
            hint: "Content shown below the testimonial — qualifications, motivation, location."

      - name: my_approach
        label: My Approach
        file: src/pages/my-approach.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - { label: Page Body, name: body, widget: markdown }

      - name: fees
        label: Fees & Booking
        file: src/pages/fees.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - { label: Page Body, name: body, widget: markdown }

      - name: faqs
        label: FAQs
        file: src/pages/faqs.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: FAQ Items
            name: faqs
            widget: list
            hint: "Add, edit or reorder questions. Drag to reorder."
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

      - name: contact
        label: Contact
        file: src/pages/contact.md
        fields:
          - label: Page Title
            name: title
            widget: string
            hint: "The main heading shown in the header band (e.g. Get in touch)"
          - label: Page Subtitle
            name: subtitle
            widget: string
            hint: "Short line below the heading in the header band"
          - label: Form Introduction
            name: intro
            widget: text
            hint: "Text shown above the contact form explaining the free introductory call"

  # ── Condition pages ───────────────────────────────────────
  - name: conditions
    label: Condition Pages
    files:
      - name: postnatal
        label: Postnatal Counselling
        file: src/pages/postnatal-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }

      - name: menopause
        label: Menopause Counselling
        file: src/pages/menopause-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }

      - name: anxiety
        label: Anxiety Counselling
        file: src/pages/anxiety-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }

      - name: confidence
        label: Confidence & Self Esteem
        file: src/pages/confidence-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }

      - name: grief
        label: Grief Counselling
        file: src/pages/grief-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }

      - name: relationship
        label: Relationship Counselling
        file: src/pages/relationship-counselling.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Page Subtitle, name: subtitle, widget: string }
          - label: Homepage card teaser
            name: teaser
            widget: text
            hint: "Shown on the homepage card. Links through to the full page."
          - { label: Page Body, name: body, widget: markdown }
