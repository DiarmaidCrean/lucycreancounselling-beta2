backend:
  name: git-gateway
  branch: main

media_folder: src/assets/images
public_folder: /assets/images

collections:
  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: src/_data/sitedata.json
        fields:
          - label: Site Name
            name: name
            widget: string
          - label: Email
            name: email
            widget: string
          - label: Phone
            name: phone
            widget: string
          - label: Address
            name: address
            widget: string
          - label: Homepage Headline
            name: headline
            widget: string
          - label: Homepage Intro
            name: intro
            widget: text
